services:
    gripello:
        container_name: gripello
        image: tilalx/verti-grade:rolling
        ports:
            - '80:80'
            - '443:443'
        environment:
            # Change before first launch, or remove after initial setup.
            PB_SUPERUSER_EMAIL: admin@example.com
            PB_SUPERUSER_PASSWORD: changeme123
            # Cache server-rendered public pages for guests this many seconds (0 = off).
            #SSR_CACHE_SECONDS: 5
            # Mail (SMTP). Uncomment and fill in to enable.
            #PB_SMTP_HOST: smtp.example.com
            #PB_SMTP_PORT: 587
            #PB_SMTP_USERNAME: apikey
            #PB_SMTP_PASSWORD: change-me
            #PB_SMTP_TLS: "true"
            #PB_APP_URL: https://climbing.example.com
            #PB_APP_NAME: Gripello
            #PB_SENDER_ADDRESS: no-reply@example.com
            #PB_SENDER_NAME: Gripello
            # Proof-of-work captcha (Cap). Unset = off.
            #CAP_SECRET: change-me-to-a-long-random-string
            # Web Push, keys from `npx web-push generate-vapid-keys`. Unset = off.
            #PB_VAPID_PUBLIC_KEY: change-me
            #PB_VAPID_PRIVATE_KEY: change-me
            # Reverse proxies in front of this container whose X-Forwarded-For is trusted.
            #TRUSTED_PROXIES: 172.18.0.0/16
        volumes:
            - ./pb_data:/pb/pb_data
            # Custom TLS certificates, replacing the auto-generated self-signed ones:
#      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
#      - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
