version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/e2e"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directories:
      - "/backend"
      - "/loadtest"
    schedule:
      interval: "weekly"
