version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Core, CLI and the native platforms must stay on the same version.
      capacitor:
        patterns: ["@capacitor/*"]

  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"
    ignore:
      # Gradle 9.6+ drops an internal API that AGP 8 uses; both move with Capacitor 9 (`npx cap migrate`).
      - dependency-name: "gradle-wrapper"
        versions: [">= 9.6"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/e2e"
    schedule:
      interval: "weekly"
    ignore:
      # A new PostgreSQL major needs a dump and restore, and the image's pg_dump has to follow it.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directories:
      - "/backend"
      - "/loadtest"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/backend/tools"
    schedule:
      interval: "weekly"
    groups:
      go-tools:
        patterns: ["*"]
