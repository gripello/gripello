<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="theme-color"
            content="#F8FAF3"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#0d1117"
            media="(prefers-color-scheme: dark)"
        />
        <title>Gripello</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f8faf3;
                --fg: #1a1c18;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0d1117;
                    --fg: #dddddd;
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: var(--bg);
                color: var(--fg);
                font-family: system-ui, sans-serif;
                text-align: center;
                padding: 16px;
                box-sizing: border-box;
            }
            img {
                width: 96px;
                border-radius: 20px;
            }
            button {
                font: inherit;
                padding: 10px 20px;
                border: 0;
                border-radius: 8px;
                background: #38741c;
                color: #fff;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main data-testid="offline-page">
            <img src="/icon-192.png" alt="" />
            <h1 id="offline-title">You are offline</h1>
            <p id="offline-text">Check your connection and try again.</p>
            <button id="offline-retry" onclick="location.reload()">
                Retry
            </button>
        </main>
        <script>
            const unreachable = {
                en: [
                    "Can't reach Gripello",
                    "The server isn't responding right now. The page reloads as soon as it's back.",
                    'Retry',
                ],
                de: [
                    'Gripello ist nicht erreichbar',
                    'Der Server antwortet gerade nicht. Die Seite lädt neu, sobald er wieder da ist.',
                    'Erneut versuchen',
                ],
                nl: [
                    'Gripello is niet bereikbaar',
                    'De server reageert nu niet. De pagina laadt opnieuw zodra hij terug is.',
                    'Opnieuw proberen',
                ],
                fr: [
                    'Gripello est injoignable',
                    'Le serveur ne répond pas pour le moment. La page se recharge dès son retour.',
                    'Réessayer',
                ],
                es: [
                    'No se puede conectar con Gripello',
                    'El servidor no responde ahora mismo. La página se recargará en cuanto vuelva.',
                    'Reintentar',
                ],
            }
            const translations = {
                de: [
                    'Du bist offline',
                    'Prüfe deine Verbindung und versuche es erneut.',
                    'Erneut versuchen',
                ],
                nl: [
                    'Je bent offline',
                    'Controleer je verbinding en probeer het opnieuw.',
                    'Opnieuw proberen',
                ],
                fr: [
                    'Vous êtes hors ligne',
                    'Vérifiez votre connexion et réessayez.',
                    'Réessayer',
                ],
                es: [
                    'Estás sin conexión',
                    'Comprueba tu conexión e inténtalo de nuevo.',
                    'Reintentar',
                ],
            }
            const texts = navigator.onLine ? unreachable : translations
            const preferred = navigator.language.slice(0, 2)
            const language = texts[preferred] ? preferred : texts.en && 'en'
            if (language) {
                document.documentElement.lang = language
                document.getElementById('offline-title').textContent =
                    texts[language][0]
                document.getElementById('offline-text').textContent =
                    texts[language][1]
                document.getElementById('offline-retry').textContent =
                    texts[language][2]
            }

            const healthy = () =>
                fetch('/api/health', { cache: 'no-store' })
                    .then((response) => response.json())
                    .then((health) => health.status === 'ok')
            const pageLoads = () =>
                fetch(location.href, { cache: 'no-store' }).then(
                    (response) => response.ok,
                )
            const reloadWhenReachable = () =>
                Promise.all([healthy(), pageLoads()])
                    .then(
                        (checks) => checks.every(Boolean) && location.reload(),
                    )
                    .catch(() => {})
            window.addEventListener('online', reloadWhenReachable)
            setInterval(reloadWhenReachable, 10000)
        </script>
    </body>
</html>
