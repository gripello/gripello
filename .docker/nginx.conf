worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 32m;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/wasm;

    upstream nuxt {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream pocketbase {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # Log to container stdout
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    proxy_cache_path /tmp/nginx-cache levels=1 keys_zone=microcache:1m max_size=50m inactive=10m;

    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/real-ip.conf;

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Built assets straight from disk with Nitro's precompressed .gz files; Node only renders pages.
        root /app/ui/public;
        gzip_static on;

        location @nuxt {
            proxy_pass http://nuxt;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /_nuxt/ {
            try_files $uri @nuxt;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /_nuxt/builds/latest.json {
            try_files $uri @nuxt;
            add_header Cache-Control "no-cache";
        }

        # The hash in /_i18n/<hash>/ does not change with the messages, so revalidate by ETag.
        location /_i18n/ {
            proxy_pass http://nuxt;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache";
        }

        location ~ ^/(app-icon\.svg|gripello-(dark|light)\.svg|icon(-192|-512)?\.png|apple-touch-icon\.png|favicon\.ico)$ {
            try_files $uri @nuxt;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            proxy_pass http://nuxt;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # One result computation per second for all Nuxt workers; staff requests carry a token and skip it.
        location = /api/ui/competition-results {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache microcache;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;
        }

        location /api/ui {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/manage {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # One GitHub lookup per 10 minutes for all Nuxt workers (unauthenticated limit: 60/h).
        location = /api/version {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache microcache;
            proxy_cache_key $uri;
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;
        }

        # Cap captcha challenge/redeem. Served by Nuxt, not PocketBase: the
        # capjs-core library is an npm package and cannot run in PocketBase's
        # goja runtime. PocketBase only verifies the token it mints.
        location /api/cap {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/realtime {
            proxy_pass http://pocketbase;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/ {
            proxy_pass http://pocketbase;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
