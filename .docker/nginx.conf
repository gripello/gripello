worker_processes auto;
# Every proxied SSE stream holds two descriptors (client + upstream).
worker_rlimit_nofile 65536;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 16384; }

http {
    include mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 32m;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/wasm;

    upstream nuxt {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream api {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    include /etc/nginx/rate-limit.conf;

    map "$request_method $uri" $rl_login { "POST /api/auth/login" $rl_key; default ""; }
    map "$request_method $uri" $rl_auth_post { "~^POST /api/auth/" $rl_key; default ""; }
    map $uri $rl_password_reset { /api/auth/password-reset/request $rl_key; default ""; }
    map $uri $rl_register { /api/auth/register $rl_key; default ""; }
    map "$request_method $uri" $rl_reports { "POST /api/reports" $rl_key; default ""; }
    map "$request_method $uri" $rl_ratings { "~^POST /api/routes/[^/]+/ratings$" $rl_key; default ""; }
    map "$request_method $uri" $rl_tasks { "~^POST /api/gyms/[^/]+/tasks$" $rl_key; default ""; }
    map "$request_method $uri" $rl_export { "GET /api/me/export" $rl_key; default ""; }
    map "$request_method $uri" $rl_members { "~^POST /api/gyms/[^/]+/members$" $rl_key; default ""; }
    map "$request_method $uri" $rl_invites_get { "~^GET /api/invites/" $rl_key; default ""; }
    map "$request_method $uri" $rl_invites_post { "~^POST /api/invites/" $rl_key; default ""; }
    map $uri $rl_climbers { "~^/api/climbers(/|$)" $rl_key; default ""; }
    map "$request_method $uri" $rl_follows { "POST /api/follows" $rl_key; default ""; }
    map "$request_method $uri" $rl_betas { "~^POST /api/routes/[^/]+/betas$" $rl_key; default ""; }
    map "$request_method $uri" $rl_ticks { "POST /api/me/ticks" $rl_key; default ""; }

    limit_req_zone $rl_key            zone=api:10m            rate=600r/m;
    limit_req_zone $rl_login          zone=login:1m           rate=2r/m;
    limit_req_zone $rl_auth_post      zone=auth_post:1m       rate=6r/m;
    limit_req_zone $rl_password_reset zone=password_reset:1m  rate=1r/m;
    limit_req_zone $rl_register       zone=register:1m        rate=1r/m;
    limit_req_zone $rl_reports        zone=reports:1m         rate=1r/m;
    limit_req_zone $rl_ratings        zone=ratings:1m         rate=24r/m;
    limit_req_zone $rl_tasks          zone=tasks:1m           rate=1r/m;
    limit_req_zone $rl_export         zone=export:1m          rate=1r/m;
    limit_req_zone $rl_members        zone=members:1m         rate=1r/m;
    limit_req_zone $rl_invites_get    zone=invites_get:1m     rate=3r/m;
    limit_req_zone $rl_invites_post   zone=invites_post:1m    rate=1r/m;
    limit_req_zone $rl_climbers       zone=climbers:1m        rate=60r/m;
    limit_req_zone $rl_follows        zone=follows:1m         rate=1r/m;
    limit_req_zone $rl_betas          zone=betas:1m           rate=1r/m;
    limit_req_zone $rl_ticks          zone=ticks:1m           rate=12r/m;
    limit_req_status 429;
    limit_conn_zone $rl_key zone=realtime_conn:10m;
    limit_conn_status 429;

    # Log to container stdout
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    proxy_cache_path /tmp/nginx-cache levels=1 keys_zone=microcache:1m max_size=50m inactive=10m;

    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/real-ip.conf;

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Built assets straight from disk with Nitro's precompressed .gz files; Node only renders pages.
        root /app/ui/public;
        gzip_static on;

        location @nuxt {
            proxy_pass http://nuxt;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /_nuxt/ {
            try_files $uri @nuxt;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /_nuxt/builds/latest.json {
            try_files $uri @nuxt;
            add_header Cache-Control "no-cache";
        }

        # The hash in /_i18n/<hash>/ does not change with the messages, so revalidate by ETag.
        location /_i18n/ {
            proxy_pass http://nuxt;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache";
        }

        location ~ ^/(app-icon\.svg|gripello-(dark|light)\.svg|icon(-192|-512)?\.png|apple-touch-icon\.png|favicon\.ico)$ {
            try_files $uri @nuxt;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            proxy_pass http://nuxt;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # One result computation per second for all Nuxt workers; staff requests carry a token and skip it.
        location = /api/ui/competition-results {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache microcache;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;
        }

        location /api/ui {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/manage {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # One GitHub lookup per 10 minutes for all Nuxt workers (unauthenticated limit: 60/h).
        location = /api/version {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache microcache;
            proxy_cache_key $uri;
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;
        }

        # Cap captcha challenge/redeem runs in Nuxt (capjs-core); the API only verifies the token.
        location /api/cap {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/realtime {
            limit_req zone=api burst=599 nodelay;
            limit_conn realtime_conn 60;
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 35m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /_blob/ {
            internal;
            alias /data/storage/;
            add_header X-Content-Type-Options nosniff;
            add_header Content-Security-Policy "default-src 'none'; media-src 'self'; style-src 'unsafe-inline'; sandbox";
        }

        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /api/$1 last;
        }

        location /api/ {
            limit_req zone=api burst=599 nodelay;
            limit_req zone=login burst=9 nodelay;
            limit_req zone=auth_post burst=29 nodelay;
            limit_req zone=password_reset burst=2 nodelay;
            limit_req zone=register burst=29 nodelay;
            limit_req zone=reports burst=19 nodelay;
            limit_req zone=ratings burst=239 nodelay;
            limit_req zone=tasks burst=39 nodelay;
            limit_req zone=export burst=2 nodelay;
            limit_req zone=members burst=49 nodelay;
            limit_req zone=invites_get burst=29 nodelay;
            limit_req zone=invites_post burst=9 nodelay;
            limit_req zone=climbers burst=59 nodelay;
            limit_req zone=follows burst=59 nodelay;
            limit_req zone=betas burst=9 nodelay;
            limit_req zone=ticks burst=119 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
