openapi: 3.1.0
info:
  title: Gripello platform administration
  version: 1.0.0
  description: Every operation needs a platform admin (401 for guests, 403 otherwise).
paths:
  /platform/users:
    get:
      operationId: listPlatformUsers
      tags: [platform]
      parameters:
        - name: q
          in: query
          description: case-insensitive substring of email, username, firstname or name
          schema: { type: string }
        - name: filter
          in: query
          schema: { type: string, enum: [platform_admins, unverified, suspended, locked, no_mfa, staff, staff_no_mfa, active, online] }
        - name: gym
          in: query
          description: only members of this gym
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [email, -email, created, -created, last_seen, -last_seen, status, -status, gyms, -gyms, mfa, -mfa], default: email }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          description: 0 returns every match unpaged (page 1, limit 0)
          schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                type: object
                required: [items, page, limit, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PlatformUser' } }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/users/summary:
    get:
      operationId: platformUserSummary
      tags: [platform]
      responses:
        '200':
          description: Account counts for the users page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformUserSummary' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPlatformUser
      tags: [platform]
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
    patch:
      operationId: updatePlatformUser
      tags: [platform]
      description: >
        Profile fields only. Another platform admin can't be edited. The user's own settings (notification_prefs, followed_walls,
        leaderboard_hidden, follow_policy, reviews_anonymous, ticks_private), platform_admin, suspension and credentials answer 403.
        A new email needs a password confirmation from the last five minutes (POST /me/reauthenticate, else 403 reauth_required).
        Sends user.updated {record, changed, actor} on `user:<id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformUserInput' }
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar: { type: string, format: binary }
                banner: { type: string, format: binary }
                '@jsonPayload': { type: string, description: PlatformUserInput as JSON }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
    delete:
      operationId: deletePlatformUser
      tags: [platform]
      description: Not yourself (DELETE /me) or another platform admin (403), not the only admin of a gym (400). Needs a password confirmation from the last five minutes (POST /me/reauthenticate, else 403 reauth_required). Revokes every session and sends user.deleted {id, actor}.
      responses:
        '204': { description: Deleted }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/users/{id}/suspension:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: suspendUser
      tags: [platform]
      description: Not yourself, not another platform admin. Needs a password confirmation from the last five minutes (POST /me/reauthenticate, else 403 reauth_required). Rotates the token key, deletes every session (session.revoked each) and mails the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                until: { type: string, format: date-time, description: a future RFC 3339 timestamp }
                permanent: { type: boolean, description: stores 9999-12-31 }
                reason: { type: string, maxLength: 2000 }
      responses:
        '204': { description: Suspended }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
    delete:
      operationId: liftSuspension
      tags: [platform]
      responses:
        '204': { description: Lifted }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/traffic:
    get:
      operationId: getPlatformTraffic
      tags: [platform]
      description: Request counts of every replica (5-minute buckets, 60-day retention) for the overview. Platform admins only.
      parameters:
        - { name: range, in: query, schema: { type: string, enum: ['1h', '24h', '7d', '30d'], default: '24h' } }
      responses:
        '200':
          description: Series, totals with the previous window, endpoints, people and system state
          content:
            application/json:
              schema:
                type: object
                required: [range, step_seconds, series, totals, previous, peak_rps, visitors_per_day, endpoints, people, system]
                properties:
                  range: { type: string }
                  step_seconds: { type: integer }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        t: { type: string, format: date-time }
                        requests: { type: integer }
                        client_errors: { type: integer }
                        server_errors: { type: integer }
                  totals: { $ref: '#/components/schemas/TrafficTotals' }
                  previous: { $ref: '#/components/schemas/TrafficTotals' }
                  peak_rps: { type: number }
                  visitors_per_day: { type: integer }
                  endpoints:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/TrafficTotals' }
                        - type: object
                          properties:
                            method: { type: string }
                            pattern: { type: string }
                            avg_ms: { type: number }
                  people: { type: object, additionalProperties: true }
                  system: { type: object, additionalProperties: true, description: 'Database, jobs, backup and mail state plus replicas: every server seen within 15 minutes (name, version, role, started, last_seen, online, realtime_clients, memory_bytes, strain: capacity problems of an online replica).' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/system:
    get:
      operationId: getPlatformSystem
      tags: [platform]
      description: Database, jobs, backup and mail state plus the replicas, without traffic. `pg_dump_missing` is set while backups are on and pg_dump is not installed. Platform admins only.
      responses:
        '200':
          description: The same object as `system` in /platform/traffic
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/stats:
    get:
      operationId: platformStats
      tags: [platform]
      responses:
        '200':
          description: Members and active routes per gym plus totals
          content:
            application/json:
              schema:
                type: object
                required: [gyms, totals]
                properties:
                  gyms:
                    type: array
                    items:
                      type: object
                      required: [id, slug, name, active, members, routes]
                      properties:
                        id: { type: string }
                        slug: { type: string }
                        name: { type: string }
                        active: { type: boolean }
                        members: { type: integer }
                        routes: { type: integer }
                  totals:
                    type: object
                    required: [gyms, active_gyms, members, routes, users]
                    properties:
                      gyms: { type: integer }
                      active_gyms: { type: integer }
                      members: { type: integer }
                      routes: { type: integer }
                      users: { type: integer }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/gyms/{id}/features:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: setGymFeatures
      tags: [platform]
      description: Replaces the gym's flags; unknown flags and non-booleans answer 400. Sends gym.updated (the gym record) on `gym:<id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
      responses:
        '200':
          description: The updated gym record
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/admins:
    post:
      operationId: grantPlatformAdmin
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/users/{id}/mfa:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: resetUserMfa
      tags: [platform]
      description: Served by authn. Deletes the user's second factors and recovery codes, ends every session and emails the user. Needs a recent password confirmation; refuses yourself and other platform admins (403).
      responses:
        '204': { description: Reset }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/users/{id}/sessions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listUserSessions
      tags: [platform]
      description: Served by authn. The user's sessions, most recently seen first.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PlatformUserSession' } } } }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
    delete:
      operationId: revokeUserSessions
      tags: [platform]
      description: Served by authn. Ends every session of the user (realtime connections lose their auth). Refuses yourself and other platform admins.
      responses:
        '204': { description: Revoked }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/users/{id}/lockout:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: clearUserLockout
      tags: [platform]
      description: Served by authn. Clears failed sign-in attempts and an active lockout. Refuses yourself and other platform admins.
      responses:
        '204': { description: Cleared }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/users/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: setUserPassword
      tags: [platform]
      description: Served by authn. Sets a new password, ends every session, clears the lockout and emails the user. Needs a recent password confirmation; refuses yourself and other platform admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password, passwordConfirm], properties: { password: { type: string }, passwordConfirm: { type: string } } }
      responses:
        '204': { description: Set }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/blocklists:
    get:
      operationId: getBlocklists
      tags: [platform]
      description: Blocked and allowed e-mail patterns (address, domain, *.domain for subdomains), protected name terms and the synced disposable-domain sources. The allowlist overrides the blocked list and the sources.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blocklists' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
    put:
      operationId: updateBlocklists
      tags: [platform]
      description: Replaces the three lists (trimmed, lowercased, deduplicated, sorted; sources are ignored). Invalid entries come back as blocked_emails.{i} / allowed_emails.{i} / protected_names.{i}; protected terms need 3 letters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Blocklists' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blocklists' }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/blocklists/check:
    post:
      operationId: checkBlocklists
      tags: [platform]
      description: How the given (possibly unsaved) lists plus the enabled sources treat an e-mail address and/or a name, and which rule decided (allowed exception first, then the blocked list, then sources).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/Blocklists' }
                - type: object
                  properties:
                    email: { type: string }
                    name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: [object, 'null']
                    properties:
                      blocked: { type: boolean }
                      rule: { type: string, enum: ['', allowed, blocked, source] }
                      match: { type: string }
                  name:
                    type: [object, 'null']
                    properties:
                      protected: { type: boolean }
                      match: { type: string }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/blocklists/emails:
    post:
      operationId: addBlockedEmails
      tags: [platform]
      description: Appends e-mail patterns to the stored list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patterns]
              properties:
                patterns: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blocklists' }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/blocklists/sources/{id}:
    put:
      operationId: setEmailSource
      tags: [platform]
      description: Turns a disposable-domain source on or off; turning on a source that never synced downloads it first.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, enum: [disposable-email-domains, mailchecker] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blocklists' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/blocklists/sources/{id}/sync:
    post:
      operationId: syncEmailSource
      tags: [platform]
      description: Downloads the source now (also runs daily for enabled sources). A failed or suspiciously short download keeps the stored list and lands in last_error.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, enum: [disposable-email-domains, mailchecker] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blocklists' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/blocklists/sources/{id}/domains:
    get:
      operationId: listEmailSourceDomains
      tags: [platform]
      description: The source's stored domains, 100 per page, sorted; q filters by substring.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, enum: [disposable-email-domains, mailchecker] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: string } }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/users/{id}/block-suggestions:
    get:
      operationId: getBlockSuggestions
      tags: [platform]
      description: What blocking the user's address or domain would cover; counts leave the user out, freemail marks public providers.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  domain: { type: string }
                  freemail: { type: boolean }
                  domain_accounts: { type: integer }
                  domain_suspended: { type: integer }
                  email_blocked: { type: boolean }
                  domain_blocked: { type: boolean }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/mail:
    get:
      operationId: getMailSettings
      tags: [platform]
      description: The stored mail settings, or the environment's (source environment) or none. The SMTP password is never returned, only smtp_password_set.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
    put:
      operationId: updateMailSettings
      tags: [platform]
      description: Needs a recent password confirmation. An empty smtp_host hands mail back to the environment; smtp_password left out keeps the stored one, "" clears it. The password is sealed at rest; every replica reloads its mailer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                smtp_host: { type: string }
                smtp_port: { type: integer, minimum: 1, maximum: 65535 }
                smtp_username: { type: string }
                smtp_password: { type: string }
                smtp_tls: { type: boolean }
                sender_address: { type: string, format: email }
                sender_name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/mail/test:
    post:
      operationId: sendTestMail
      tags: [platform]
      description: Sends a test email to the caller over the live transport; 5 per minute per admin, 409 when mail is not configured, 400 carries the SMTP error.
      responses:
        '204': { description: Sent }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '409': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '429': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/logs:
    get:
      operationId: listServerLogs
      tags: [platform]
      description: The newest 2000 log records of every replica (kept 7 days), newest first, at or above level.
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error], default: info } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  level: { type: string }
                  replicas: { type: array, description: 'Servers seen within 15 minutes, as in getPlatformTraffic system.replicas', items: { type: object, additionalProperties: true } }
                  items:
                    type: array
                    items: { type: object, properties: { time: { type: string, format: date-time }, replica: { type: string }, level: { type: string }, message: { type: string }, attrs: { type: object } } }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/logs/level:
    put:
      operationId: setLogLevel
      tags: [platform]
      description: Stores the runtime log level; every replica applies it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [level], properties: { level: { type: string, enum: [debug, info, warn, error] } } }
      responses:
        '200': { description: OK }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/issues:
    get:
      operationId: listIssues
      tags: [platform]
      description: WARN and ERROR log records of every replica grouped by fingerprint (message, route, kind, error with ids and numbers masked), errors first, then newest.
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 24h, 7d], default: 24h } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object, properties: { fingerprint: { type: string }, level: { type: string }, message: { type: string }, sample: { type: object }, count: { type: integer }, users: { type: integer }, first_seen: { type: string, format: date-time }, last_seen: { type: string, format: date-time } } }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/issues/{fingerprint}:
    get:
      operationId: listIssueOccurrences
      tags: [platform]
      description: The newest 100 records of one issue.
      parameters:
        - { name: fingerprint, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /client-errors:
    post:
      operationId: reportClientError
      tags: [platform]
      description: A browser error, logged at ERROR with source=client so it joins the issues. No URL query or user input; capped per replica and per IP. Over the cap it still answers 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, message]
              properties:
                kind: { type: string, enum: [vue, window, promise, chunk, nuxt] }
                message: { type: string, maxLength: 500 }
                stack: { type: string, maxLength: 2000 }
                route: { type: string, description: 'Matched route pattern, e.g. /:gym/routes' }
                version: { type: string }
      responses:
        '204': { description: Logged }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/oauth2:
    get:
      operationId: listOAuthProviderSettings
      tags: [platform]
      description: Served by authn. Every provider with its settings, client_secret_set/private_key_set instead of the secrets, and the redirect URI to register at the provider.
      responses:
        '200': { description: OK }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/oauth2/{provider}:
    put:
      operationId: saveOAuthProviderSettings
      tags: [platform]
      description: Served by authn. Needs a recent password confirmation. client_secret and private_key left out keep the stored values; secrets are sealed at rest. The generic oidc provider needs an https issuer_url and a display_name when enabled.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, apple, microsoft, oidc] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                client_id: { type: string }
                client_secret: { type: string }
                display_name: { type: string }
                issuer_url: { type: string }
                tenant: { type: string }
                team_id: { type: string }
                key_id: { type: string }
                private_key: { type: string }
      responses:
        '200': { description: OK }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
  /platform/admins/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokePlatformAdmin
      tags: [platform]
      description: Needs a password confirmation from the last five minutes (POST /me/reauthenticate, else 403 reauth_required). Removing your own rights or a non-admin answers 400; admin rows are locked, so of two admins revoking each other the second gets 403. The user gets an email.
      responses:
        '204': { description: Revoked }
        '400': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '401': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '403': { $ref: 'shared/error.yaml#/components/responses/Error' }
        '404': { $ref: 'shared/error.yaml#/components/responses/Error' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    User:
      description: The user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformUser' }
  schemas:
    TrafficTotals:
      type: object
      properties:
        requests: { type: integer }
        client_errors: { type: integer }
        server_errors: { type: integer }
        p95_ms: { type: number }
    Blocklists:
      type: object
      properties:
        blocked_emails: { type: array, items: { type: string } }
        allowed_emails: { type: array, items: { type: string } }
        protected_names: { type: array, items: { type: string } }
        sources:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              homepage: { type: string, format: uri }
              license: { type: string }
              notice: { type: string, description: 'Upstream license notice downloaded with the list (MIT), empty for CC0.' }
              enabled: { type: boolean }
              synced_at: { type: [string, 'null'], format: date-time }
              attempted_at: { type: [string, 'null'], format: date-time }
              domain_count: { type: integer }
              last_error: { type: string }
    MailSettings:
      type: object
      properties:
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        smtp_password_set: { type: boolean }
        smtp_tls: { type: boolean }
        sender_address: { type: string }
        sender_name: { type: string }
        source: { type: string, enum: [database, environment, none] }
    PlatformUserInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 150 }
        firstname: { type: string, maxLength: 5000 }
        name: { type: string, maxLength: 5000 }
        email: { type: string, format: email }
        verified: { type: boolean }
        email_visibility: { type: boolean }
        language: { type: string, enum: ['', en, de, nl, fr, es] }
        avatar: { type: ['null', string], description: null or "" clears }
        banner: { type: ['null', string], description: null or "" clears }
    PlatformUserSummary:
      type: object
      required: [total, new_7d, active_7d, online, unverified, unverified_old, suspended, locked, platform_admins, staff, staff_no_mfa]
      properties:
        total: { type: integer }
        new_7d: { type: integer }
        active_7d: { type: integer }
        online: { type: integer, description: accounts with a session seen in the last 2 minutes (open realtime streams refresh it every 30 s) }
        unverified: { type: integer }
        unverified_old: { type: integer, description: 'unverified and created more than 48 hours ago, so the verification link has expired' }
        suspended: { type: integer }
        locked: { type: integer }
        platform_admins: { type: integer }
        staff: { type: integer, description: accounts with any gym membership }
        staff_no_mfa: { type: integer }
    PlatformUserSession:
      type: object
      required: [id, created, method, user_agent, ip, current]
      properties:
        id: { type: string }
        created: { type: string, format: date-time }
        method: { type: string, enum: ['', password, totp, passkey, recovery] }
        user_agent: { type: string }
        ip: { type: string }
        last_seen: { type: [string, 'null'], format: date-time }
        current: { type: boolean }
    PlatformUser:
      type: object
      description: The users row without password_hash and token_key, plus memberships.
      required: [id, email, username, platform_admin, verified, memberships]
      properties:
        id: { type: string }
        email: { type: string }
        username: { type: string }
        firstname: { type: string }
        name: { type: string }
        avatar: { type: string }
        verified: { type: boolean }
        verified_at: { type: ['null', string], format: date-time }
        platform_admin: { type: boolean }
        suspended_until: { type: ['null', string], format: date-time }
        suspension_reason: { type: string }
        created: { type: string, format: date-time }
        last_seen: { type: ['null', string], format: date-time }
        ticks_count: { type: integer, description: 'only on GET /platform/users/{id}' }
        ratings_count: { type: integer, description: 'only on GET /platform/users/{id}' }
        memberships:
          type: array
          items:
            type: object
            required: [id, gym, role]
            properties:
              id: { type: string }
              gym: { type: string }
              role: { type: string }
      additionalProperties: true
