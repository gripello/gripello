openapi: 3.1.0
info:
  title: Gripello platform administration
  version: 1.0.0
description: Every operation needs a platform admin (401 for guests, 403 otherwise).
paths:
  /platform/users:
    get:
      operationId: listPlatformUsers
      tags: [platform]
      parameters:
        - name: q
          in: query
          description: case-insensitive substring of email, username, firstname or name
          schema: { type: string }
        - name: filter
          in: query
          schema: { type: string, enum: [platform_admins, unverified, suspended] }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          description: 0 returns every match unpaged (page 1, limit 0)
          schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
      responses:
        '200':
          description: One page of users, ordered by email
          content:
            application/json:
              schema:
                type: object
                required: [items, page, limit, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PlatformUser' } }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPlatformUser
      tags: [platform]
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updatePlatformUser
      tags: [platform]
      description: >
        Profile fields only. Another platform admin can't be edited. The user's own settings (notification_prefs, followed_walls,
        leaderboard_hidden, follow_policy, reviews_anonymous, ticks_private), platform_admin, suspension and credentials answer 403.
        A new email needs a password confirmation from the last five minutes (POST /me/reauthenticate, else 403 reauth_required).
        Sends user.updated {record, changed, actor} on `user:<id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformUserInput' }
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar: { type: string, format: binary }
                banner: { type: string, format: binary }
                '@jsonPayload': { type: string, description: PlatformUserInput as JSON }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deletePlatformUser
      tags: [platform]
      description: Not yourself (DELETE /me) or another platform admin (403), not the only admin of a gym (400). Needs a password confirmation from the last five minutes (POST /me/reauthenticate, else 403 reauth_required). Revokes every session and sends user.deleted {id, actor}.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/users/{id}/suspension:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: suspendUser
      tags: [platform]
      description: Not yourself, not another platform admin. Needs a password confirmation from the last five minutes (POST /me/reauthenticate, else 403 reauth_required). Rotates the token key, deletes every session (session.revoked each) and mails the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                until: { type: string, description: future date (RFC 3339 or `YYYY-MM-DD HH:MM:SS.sssZ`) }
                permanent: { type: boolean, description: stores 9999-12-31 }
                reason: { type: string, maxLength: 2000 }
      responses:
        '204': { description: Suspended }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: liftSuspension
      tags: [platform]
      responses:
        '204': { description: Lifted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/traffic:
    get:
      operationId: getPlatformTraffic
      tags: [platform]
      description: Request counts of every replica (5-minute buckets, 60-day retention) for the overview. Platform admins only.
      parameters:
        - { name: range, in: query, schema: { type: string, enum: ['1h', '24h', '7d', '30d'], default: '24h' } }
      responses:
        '200':
          description: Series, totals with the previous window, endpoints, people and system state
          content:
            application/json:
              schema:
                type: object
                required: [range, step_seconds, series, totals, previous, peak_rps, visitors_per_day, endpoints, people, system]
                properties:
                  range: { type: string }
                  step_seconds: { type: integer }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        t: { type: string, format: date-time }
                        requests: { type: integer }
                        client_errors: { type: integer }
                        server_errors: { type: integer }
                  totals: { $ref: '#/components/schemas/TrafficTotals' }
                  previous: { $ref: '#/components/schemas/TrafficTotals' }
                  peak_rps: { type: number }
                  visitors_per_day: { type: integer }
                  endpoints:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/TrafficTotals' }
                        - type: object
                          properties:
                            method: { type: string }
                            pattern: { type: string }
                            avg_ms: { type: number }
                  people: { type: object, additionalProperties: true }
                  system: { type: object, additionalProperties: true, description: 'Database, jobs, backup and mail state plus replicas: every server seen within 15 minutes (name, version, role, started, last_seen, online, realtime_clients, memory_bytes).' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/stats:
    get:
      operationId: platformStats
      tags: [platform]
      responses:
        '200':
          description: Members and active routes per gym plus totals
          content:
            application/json:
              schema:
                type: object
                required: [gyms, totals]
                properties:
                  gyms:
                    type: array
                    items:
                      type: object
                      required: [id, slug, name, active, members, routes]
                      properties:
                        id: { type: string }
                        slug: { type: string }
                        name: { type: string }
                        active: { type: boolean }
                        members: { type: integer }
                        routes: { type: integer }
                  totals:
                    type: object
                    required: [gyms, active_gyms, members, routes, users]
                    properties:
                      gyms: { type: integer }
                      active_gyms: { type: integer }
                      members: { type: integer }
                      routes: { type: integer }
                      users: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/features:
    get:
      operationId: listFeatureFlags
      tags: [platform]
      responses:
        '200':
          description: The feature flag registry
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/gyms/{id}/features:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: setGymFeatures
      tags: [platform]
      description: Replaces the gym's flags; unknown flags and non-booleans answer 400. Sends gym.updated (the gym record) on `gym:<id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
      responses:
        '200':
          description: The updated gym record
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/admins:
    post:
      operationId: grantPlatformAdmin
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/users/{id}/mfa:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: resetUserMfa
      tags: [platform]
      description: Served by authn. Deletes the user's second factors and recovery codes, ends every session and emails the user. Needs a recent password confirmation; refuses yourself and other platform admins (403).
      responses:
        '204': { description: Reset }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/users/{id}/sessions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeUserSessions
      tags: [platform]
      description: Served by authn. Ends every session of the user (realtime connections lose their auth). Refuses yourself and other platform admins.
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/users/{id}/lockout:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: clearUserLockout
      tags: [platform]
      description: Served by authn. Clears failed sign-in attempts and an active lockout. Refuses yourself and other platform admins.
      responses:
        '204': { description: Cleared }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/users/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: setUserPassword
      tags: [platform]
      description: Served by authn. Sets a new password, ends every session, clears the lockout and emails the user. Needs a recent password confirmation; refuses yourself and other platform admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password, passwordConfirm], properties: { password: { type: string }, passwordConfirm: { type: string } } }
      responses:
        '204': { description: Set }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/mail:
    get:
      operationId: getMailSettings
      tags: [platform]
      description: The stored mail settings, or the environment's (source environment) or none. The SMTP password is never returned, only smtp_password_set.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateMailSettings
      tags: [platform]
      description: Needs a recent password confirmation. An empty smtp_host hands mail back to the environment; smtp_password left out keeps the stored one, "" clears it. The password is sealed at rest; every replica reloads its mailer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                smtp_host: { type: string }
                smtp_port: { type: integer, minimum: 1, maximum: 65535 }
                smtp_username: { type: string }
                smtp_password: { type: string }
                smtp_tls: { type: boolean }
                sender_address: { type: string, format: email }
                sender_name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/mail/test:
    post:
      operationId: sendTestMail
      tags: [platform]
      description: Sends a test email to the caller over the live transport; 5 per minute per admin, 409 when mail is not configured, 400 carries the SMTP error.
      responses:
        '204': { description: Sent }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /platform/logs:
    get:
      operationId: listServerLogs
      tags: [platform]
      description: The newest 2000 log records of every replica (kept 7 days), newest first, at or above level.
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error], default: info } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  level: { type: string }
                  replicas: { type: array, description: 'Servers seen within 15 minutes, as in getPlatformTraffic system.replicas', items: { type: object, additionalProperties: true } }
                  items:
                    type: array
                    items: { type: object, properties: { time: { type: string, format: date-time }, replica: { type: string }, level: { type: string }, message: { type: string }, attrs: { type: object } } }
        '400': { $ref: '#/components/responses/Error' }
  /platform/logs/level:
    put:
      operationId: setLogLevel
      tags: [platform]
      description: Stores the runtime log level; every replica applies it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [level], properties: { level: { type: string, enum: [debug, info, warn, error] } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
  /platform/oauth2:
    get:
      operationId: listOAuthProviderSettings
      tags: [platform]
      description: Served by authn. Every provider with its settings, client_secret_set/private_key_set instead of the secrets, and the redirect URI to register at the provider.
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
  /platform/oauth2/{provider}:
    put:
      operationId: saveOAuthProviderSettings
      tags: [platform]
      description: Served by authn. Needs a recent password confirmation. client_secret and private_key left out keep the stored values; secrets are sealed at rest. The generic oidc provider needs an https issuer_url and a display_name when enabled.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, apple, microsoft, oidc] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                client_id: { type: string }
                client_secret: { type: string }
                display_name: { type: string }
                issuer_url: { type: string }
                tenant: { type: string }
                team_id: { type: string }
                key_id: { type: string }
                private_key: { type: string }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/admins/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokePlatformAdmin
      tags: [platform]
      description: Needs a password confirmation from the last five minutes (POST /me/reauthenticate, else 403 reauth_required). Removing your own rights or a non-admin answers 400; admin rows are locked, so of two admins revoking each other the second gets 403. The user gets an email.
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    User:
      description: The user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformUser' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    TrafficTotals:
      type: object
      properties:
        requests: { type: integer }
        client_errors: { type: integer }
        server_errors: { type: integer }
        p95_ms: { type: number }
    MailSettings:
      type: object
      properties:
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        smtp_password_set: { type: boolean }
        smtp_tls: { type: boolean }
        sender_address: { type: string }
        sender_name: { type: string }
        source: { type: string, enum: [database, environment, none] }
    Error:
      type: object
      required: [status, message, data]
      properties:
        status: { type: integer }
        message: { type: string }
        data:
          type: object
          additionalProperties:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
    PlatformUserInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 150 }
        firstname: { type: string, maxLength: 5000 }
        name: { type: string, maxLength: 5000 }
        email: { type: string, format: email }
        verified: { type: boolean }
        email_visibility: { type: boolean }
        language: { type: string, enum: ['', en, de, nl, fr, es] }
        avatar: { type: ['null', string], description: null or "" clears }
        banner: { type: ['null', string], description: null or "" clears }
    PlatformUser:
      type: object
      description: The users row without password_hash and token_key, plus memberships.
      required: [id, email, username, platform_admin, verified, memberships]
      properties:
        id: { type: string }
        email: { type: string }
        username: { type: string }
        firstname: { type: string }
        name: { type: string }
        avatar: { type: string }
        verified: { type: boolean }
        platform_admin: { type: boolean }
        suspended_until: { type: ['null', string], format: date-time }
        suspension_reason: { type: string }
        created: { type: string, format: date-time }
        memberships:
          type: array
          items:
            type: object
            required: [id, gym, role]
            properties:
              id: { type: string }
              gym: { type: string }
              role: { type: string }
      additionalProperties: true
