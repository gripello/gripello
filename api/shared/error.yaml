openapi: 3.1.0
info:
  title: Gripello shared error response
  version: 1.0.0
paths: {}
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [status, message, data]
      properties:
        status: { type: integer }
        message: { type: string }
        data:
          type: object
          additionalProperties:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
