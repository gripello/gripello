services:
    app:
        image: ${E2E_IMAGE:?E2E_IMAGE must be set}
        stop_grace_period: 1s
        networks:
            default:
                aliases:
                    - vg.test
        environment:
            DATABASE_URL: postgres://postgres:e2e@postgres:5432/gripello?sslmode=disable
            NUXT_API_BASE: http://127.0.0.1:8080
            RATE_LIMITS: 'off'
            SSR_CACHE_SECONDS: '0'
            URGENT_ALERT_SECONDS: '0'
            SSL_DNS_NAMES: vg.test
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            SMTP_TLS: 'false'
            APP_URL: https://vg.test
            SENDER_ADDRESS: no-reply@gripello.test
            SENDER_NAME: Gripello E2E
            APP_NAME: Gripello
        depends_on:
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_started
        volumes:
            - e2e-ssl:/etc/nginx/ssl
            - gripello-bin:/app/bin
        healthcheck:
            test: ['CMD', 'sh', '-c', 'node /app/healthcheck.mjs']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    postgres:
        image: postgres:18-alpine
        shm_size: 256mb
        environment:
            POSTGRES_PASSWORD: e2e
            POSTGRES_DB: gripello
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'gripello']
            interval: 2s
            timeout: 5s
            retries: 30

    mailpit:
        image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
        networks:
            default:
                aliases:
                    - mailpit
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    e2e:
        image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        working_dir: /work
        shm_size: 1gb
        volumes:
            - ..:/work:z
            - e2e-ssl:/ssl:ro
            - gripello-bin:/opt/gripello:ro
            - yarn-cache:/root/.yarn/berry/cache
        environment:
            E2E_BASE_URL: https://vg.test
            E2E_API_URL: https://vg.test
            E2E_GRIPELLO: /opt/gripello/gripello
            DATABASE_URL: postgres://postgres:e2e@postgres:5432/gripello?sslmode=disable
            MAILPIT_URL: http://mailpit:8025
            CI: 'true'
            E2E_WORKERS: ${E2E_WORKERS:-}
            E2E_DEPS_INSTALLED: ${E2E_DEPS_INSTALLED:-}
            NODE_EXTRA_CA_CERTS: /ssl/cert.pem
        depends_on:
            app:
                condition: service_healthy
            mailpit:
                condition: service_started
        command: >
            sh -c "cp /ssl/cert.pem /usr/local/share/ca-certificates/gripello-e2e.crt &&
            update-ca-certificates &&
            corepack enable && { [ -n \"$${E2E_DEPS_INSTALLED:-}\" ] || yarn install --immutable --mode=skip-build; } && yarn test:e2e ${E2E_ARGS:-}"

volumes:
    e2e-ssl:
    gripello-bin:
    yarn-cache:
        name: gripello-e2e-yarn-cache
        external: true
