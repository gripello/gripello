services:
    app:
        image: ${E2E_IMAGE:?E2E_IMAGE must be set}
        stop_grace_period: 1s
        networks:
            default:
                aliases:
                    - vg.test
        environment:
            DATABASE_URL: postgres://postgres:e2e@postgres:5432/gripello?sslmode=disable
            NUXT_API_BASE: http://127.0.0.1:8080
            RATE_LIMITS: 'off'
            SSL_DNS_NAMES: vg.test
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            SMTP_TLS: 'false'
            APP_URL: https://vg.test
            SENDER_ADDRESS: no-reply@gripello.test
            SENDER_NAME: Gripello E2E
            APP_NAME: Gripello
        depends_on:
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_started
        volumes:
            - e2e-ssl:/etc/nginx/ssl
            - gripello-bin:/app/bin
        healthcheck:
            test: ['CMD', 'sh', '-c', 'node /app/healthcheck.mjs']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_PASSWORD: e2e
            POSTGRES_DB: gripello
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'gripello']
            interval: 2s
            timeout: 5s
            retries: 30

    mailpit:
        image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        networks:
            default:
                aliases:
                    - mailpit
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    e2e:
        image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
        working_dir: /work
        shm_size: 1gb
        volumes:
            - ..:/work:Z
            - e2e-ssl:/ssl:ro
            - gripello-bin:/opt/gripello:ro
            - yarn-cache:/root/.yarn/berry/cache
        environment:
            E2E_BASE_URL: https://vg.test
            E2E_PB_URL: https://vg.test
            E2E_GRIPELLO: /opt/gripello/gripello
            DATABASE_URL: postgres://postgres:e2e@postgres:5432/gripello?sslmode=disable
            MAILPIT_URL: http://mailpit:8025
            CI: 'true'
            NODE_TLS_REJECT_UNAUTHORIZED: '0'
        depends_on:
            app:
                condition: service_healthy
            mailpit:
                condition: service_started
        command: >
            sh -c "cp /ssl/cert.pem /usr/local/share/ca-certificates/gripello-e2e.crt &&
            update-ca-certificates &&
            corepack enable && yarn install --immutable --mode=skip-build && yarn test:e2e ${E2E_ARGS:-}"

volumes:
    e2e-ssl:
    gripello-bin:
    yarn-cache:
        name: gripello-e2e-yarn-cache
        external: true
